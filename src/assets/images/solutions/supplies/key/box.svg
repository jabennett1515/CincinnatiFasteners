<svg 
  width="100" 
  height="100" 
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradientPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC6C7"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  
  <!-- Main Icon Container (Optional Light Shadow) -->
  <g>
    <!-- Shadow -->
    <ellipse cx="50" cy="80" rx="30" ry="6" fill="rgba(0,0,0,0.1)"/>
    
    <!-- Box #1 -->
    <rect 
      x="20" 
      y="25" 
      width="20" 
      height="20" 
      rx="3" 
      fill="url(#gradientPink)"
      stroke="#d8a8a9" 
      stroke-width="1"
    />
    <!-- Tiny "flap" or handle line on top box -->
    <line 
      x1="25" 
      y1="25" 
      x2="35" 
      y2="25" 
      stroke="#dbaeb1" 
      stroke-width="2"
      stroke-linecap="round"
    />
    
    <!-- Box #2 -->
    <rect 
      x="40" 
      y="35" 
      width="20" 
      height="20" 
      rx="3" 
      fill="url(#gradientPink)"
      stroke="#d8a8a9" 
      stroke-width="1"
    />
    <line 
      x1="45" 
      y1="35" 
      x2="55" 
      y2="35" 
      stroke="#dbaeb1" 
      stroke-width="2"
      stroke-linecap="round"
    />
    
    <!-- Box #3 -->
    <rect 
      x="60" 
      y="25" 
      width="20" 
      height="20" 
      rx="3" 
      fill="url(#gradientPink)"
      stroke="#d8a8a9" 
      stroke-width="1"
    />
    <line 
      x1="65" 
      y1="25" 
      x2="75" 
      y2="25" 
      stroke="#dbaeb1" 
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>
</svg>
