<svg 
  width="100" 
  height="100" 
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradientLavender" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D9F1"/>
      <stop offset="100%" stop-color="#FFF"/>
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="50" cy="80" rx="30" ry="6" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Outer Curved Brackets to suggest grouping -->
  <path 
    d="M20,35 C15,40 15,60 20,65
       M80,35 C85,40 85,60 80,65" 
    stroke="#b7a5cd" 
    stroke-width="3" 
    fill="none"
    stroke-linecap="round"
  />
  
  <!-- Part 1: A simplified bolt-like shape -->
  <rect 
    x="35" 
    y="30" 
    width="10" 
    height="20" 
    rx="3" 
    fill="url(#gradientLavender)"
    stroke="#b7a5cd" 
    stroke-width="1"
  />
  <!-- Part 2: A small ring/washer -->
  <circle 
    cx="55" 
    cy="40" 
    r="6" 
    fill="url(#gradientLavender)"
    stroke="#b7a5cd" 
    stroke-width="1"
  />
  <!-- Part 3: A simple clip shape -->
  <path 
    d="M45,50 
       a5,5 0 1 1 10,0
       a3,3 0 0 1 -10,0" 
    fill="url(#gradientLavender)"
    stroke="#b7a5cd" 
    stroke-width="1"
  />
</svg>
