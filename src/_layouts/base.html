<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="vXGg3n1VMVnazlwq4YBSywhwzTHA8_DalqQ2vI-WSSI"
    />
    <!--Swap our for actual link-->
    <link rel="canonical" href="https://{{ client.domain }}{{ page.url }}" />

    <meta name="description" content="{{ description }}" />
    <meta name="keywords" content="" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-254NL7WZ9B"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-254NL7WZ9B");
    </script>

    <!--Social Media Display-->
    <meta property="og:title" content="{{ metaTitle }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://{{ client.domain }}{{ page.url }}"
    />

    <meta
      property="og:image"
      content="https://www.cincinnatifastener.com/assets/images/header/logo.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://www.cincinnatifastener.com/assets/images/header/logo.png"
    />

    <!--Favicons-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32x32.png"
    />
    <!-- <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/16.png"
    /> -->
    <!-- <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png"> -->
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Preload -->
    <link rel="preload" as="image" href="/assets/favicons/180.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/fonts/Sofia-Pro-Medium-Az.otf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../assets/fonts/Sofia Pro Bold Az.otf"
      crossorigin
    />

    <link rel="stylesheet" href="/css/root.css" />

    <link rel="preload" as="image" href="{{ preloadImg }}" />

    <!-- Loading in page specific CSS sheets from css block -->
    <link rel="stylesheet" href="/css/critical.css" />
    <link rel="stylesheet" href="{{ preloadCSS }}" />

    <!--Put analytics tag here at the bottom to prevent it from render blocking-->

    <!-- For home page, use full title, including location for SEO. Other pages should just include the page name -->
    <title>
      {% if page.url == '/'%} {{ client.name }} | {{ tagTitle }} | {{
      client.address.city }}, {{ client.address.county }} {% else %} {{ tagTitle
      }} | {{ client.name }} {% endif %}
    </title>
  </head>
  <body>
    <!--Screen reader skip main nav-->
    <a class="skip" aria-label="skip to main content" href="#main"
      >Click To Skip To Main Content</a
    >

    {% include "header.html" %}
    <main id="main">{{ content | safe }}</main>
    {% include "footer.html" %}

    <script defer src="/assets/js/nav.js"></script>
    <script defer src="/assets/js/services.js"></script>

    <!--
        This script adds a class to the body after scrolling 100px
        and we used these body.scroll styles to create some on scroll 
        animations with the navbar
    -->
    <script defer>
      document.addEventListener("scroll", (e) => {
        const scroll = document.documentElement.scrollTop;
        if (scroll >= 100) {
          document.querySelector("body").classList.add("scroll");
        } else {
          document.querySelector("body").classList.remove("scroll");
        }
      });
    </script>
  </body>
</html>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const elements = document.querySelectorAll(".fade-in");

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target); // Stop observing once the element is visible
          }
        });
      },
      { threshold: 0.00001 } // Trigger when 10% of the element is visible
    );

    elements.forEach((el) => observer.observe(el));
  });
</script>
